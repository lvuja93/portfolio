version: '3.8'

networks:
  web:
    external: true

services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lazarvujovic
    restart: unless-stopped
    expose:
      - '3000'
    networks:
      - web
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web'

      # Middleware — jedinstven naziv
      - "traefik.http.middlewares.lazarvujovic-wwwtoapex.redirectregex.regex=^https?://www\\.lazarvujovic\\.com/(.*)"
      - 'traefik.http.middlewares.lazarvujovic-wwwtoapex.redirectregex.replacement=https://lazarvujovic/$1'

      # Router — jedinstven
      - 'traefik.http.routers.lazarvujovic.rule=Host(`lazarvujovic.com`,`www.lazarvujovic.com`)'
      - 'traefik.http.routers.lazarvujovic.entrypoints=websecure'
      - 'traefik.http.routers.lazarvujovic.tls=true'
      - 'traefik.http.routers.lazarvujovic.tls.certresolver=myresolver'
      - 'traefik.http.routers.lazarvujovic.middlewares=lazarvujovic-wwwtoapex'

      # Service — jedinstven
      - 'traefik.http.services.lazarvujovic.loadbalancer.server.port=3000'
